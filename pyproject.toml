[project]
name = "data-science-project-template"
version = "0.1.0"
description = "my data science project template"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "dotmap>=1.3.30",
    "hydra-core>=1.3.2",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.10.9",
    "mlflow>=3.18.0",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "ruff==0.15.12",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
