[tool.poetry]
name = "data-project"
version = "0.1.0"
description = "my data science project template"
license = "MIT"
authors = ["Hideaki Kanehara <hideaki.kanehara@gmail.com>"]
readme = "README.md"
packages = [{include = "data_project"}]
keywords = ["python", "data-science", "machine-learning", "template"]

[tool.poetry.dependencies]
python = "^3.10"
polars = "^0.16.9"
jupyterlab = "^3.6.1"
numpy = "^1.23"
hydra-core = "^1.3.2"
mlflow = "^2.2.1"
pandas = "^1.5.3"
scikit-learn = "^1.2.1"
matplotlib = "^3.7.0"
seaborn = "^0.12.2"
tqdm = "^4.64.1"
numba = "^0.56.4"
dotmap = "^1.3.30"


[tool.poetry.group.dev.dependencies]

[tool.black]
target-version = ['py310']
exclude = '''
(\.git|\.mypy_cache|.venv|build|dist|snapshots|snap_)
'''

[tool.isort]
line_length = 88  # blackのデフォルト値
multi_line_output = 3  # ref: https://pycqa.github.io/isort/docs/configuration/multi_line_output_modes.html
include_trailing_comma = true  # 複数行importしたときに末尾にカンマをつけるかどうか

[tool.flake8]
max-line-length = 88  # black
max-complexity = 10
ignore = "E266,"

exclude = [
  "__pycache__",
  "*/snapshots/snap_test_*"
]

[tool.mypy]
python_version="3.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
